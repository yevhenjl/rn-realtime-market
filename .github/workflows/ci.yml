name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx expo install --check
      - run: bun run doctor
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test -- --ci --coverage --runInBand
      - run: bunx expo prebuild --no-install --platform android
      - run: bunx expo export --platform android --output-dir dist --max-workers 2
