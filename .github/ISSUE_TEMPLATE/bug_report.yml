name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run the app?
      options:
        - Development build (debug, with Metro)
        - Preview build (release APK from EAS)
        - Local release build (bunx expo run:android --variant release)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Model and OS version, for example "Galaxy M23 5G, Android 14".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Metro output, `adb logcat` excerpt or a screenshot. Remove anything personal.
      render: shell
    validations:
      required: false
